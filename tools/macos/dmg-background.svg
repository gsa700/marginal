<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <!-- The window Marginal.dmg opens in (make-macos-app.sh, its dmg option):
       the app at (170, 190) and Applications at (490, 190), where the script
       places their icons, with an arrow from one to the other. Light, because
       Finder draws the icons' labels dark in the light appearance. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f7f9"/>
      <stop offset="1" stop-color="#e6e6ea"/>
    </linearGradient>
  </defs>
  <rect width="660" height="400" fill="url(#bg)"/>
  <text x="330" y="62" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="22" font-weight="600" fill="#1d1d1f">Drag Marginal to Applications</text>
  <path d="M262,190 L376,190" stroke="#3a3a40" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M370,172 L398,190 L370,208 z" fill="#3a3a40" stroke="#3a3a40" stroke-width="4" stroke-linejoin="round"/>
  <text x="330" y="338" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="14" fill="#6e6e73">Then start it from Applications. It offers to eject this disk the first time.</text>
</svg>
